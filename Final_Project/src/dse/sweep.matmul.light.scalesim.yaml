simulator: scalesim
clock_seconds: 1e-9
timeout_seconds: 180
keep_failed_runs: true

out_dir: ../results/scalesim_runs_light_matmul

constants:
  datawidth: 8
  problem_m: 64
  problem_n: 64
  problem_k: 16
  scalesim_dataflow: ws

fixed:
  local_buffer_depth: 256
  local_buffer_bw: 64

sweep:
  pe_dim: [8, 16, 32, 64]
  global_buffer_depth: [131072, 262144]
  backing_storage_bw: [32, 64, 128, 256]
