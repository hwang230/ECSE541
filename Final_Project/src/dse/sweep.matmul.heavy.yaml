# Matmul-focused heavy workload using the same sweep parameters as medium.
clock_seconds: 1e-9
timeout_seconds: 240
keep_failed_runs: true

arch_template: templates/systolic_array_arch.template.yaml
problem: problem_example.yaml
mapping: mapping_example.yaml
out_dir: ../results/dse_runs_heavy_matmul

constants:
  # Use a real technology node; -1 forces dummy placeholder estimations.
  technology: 22nm
  datawidth: 8
  global_cycle_seconds: 1e-9
  # Heavy GEMM workload (larger than medium).
  problem_m: 2048
  problem_n: 2048
  problem_k: 1024
  # Keep strong K reuse in local buffer.
  k_tile: 32

fixed:
  local_buffer_depth: 256
  local_buffer_bw: 64

sweep:
  pe_dim: [8, 16, 32, 64]
  # Increased to fit heavy-workload mapped tiles at BackingStorage.
  global_buffer_depth: [2097152, 4194304]
  backing_storage_bw: [32, 64, 128, 256]
