simulator: scalesim
clock_seconds: 1e-9
timeout_seconds: 900
keep_failed_runs: true

out_dir: ../results/scalesim_runs_medium_matmul

constants:
  datawidth: 8
  # Moderate GEMM that stays practical for Scale-Sim DSE runtime.
  problem_m: 256
  problem_n: 256
  problem_k: 128
  scalesim_dataflow: ws

fixed:
  local_buffer_depth: 256
  local_buffer_bw: 64

sweep:
  pe_dim: [8, 16, 32, 64]
  global_buffer_depth: [131072, 262144]
  backing_storage_bw: [32, 64, 128, 256]
